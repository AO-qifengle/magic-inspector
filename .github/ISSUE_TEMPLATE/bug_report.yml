name: Bug report
description: Report a reproducible problem in Magic Inspector
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Magic Inspector. Please remove any personal IP addresses, account details, or other sensitive information before submitting.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Tell us what you expected and what occurred instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Run …
        3. See …
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Android
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "For example: 1.1.0"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Add screenshots or logs only after redacting private information.
